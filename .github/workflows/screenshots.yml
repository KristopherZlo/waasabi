name: README screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - database/seeders/**
      - resources/css/**
      - resources/js/**
      - resources/views/**
      - routes/**
      - scripts/capture-readme-screenshots.mjs

permissions:
  contents: write

jobs:
  screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build

      - name: Create screenshot data
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/waasabi.sqlite
          php artisan migrate:fresh --seed --force

      - name: Capture screenshots
        run: |
          php artisan serve --host=127.0.0.1 --port=8081 > storage/logs/screenshots.log 2>&1 &
          node --experimental-websocket scripts/capture-readme-screenshots.mjs

      - name: Commit changed screenshots
        run: |
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh README screenshots"
          git push
